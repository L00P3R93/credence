# nginx bot-blocking snippet
# Location: /etc/nginx/snippets/block-bots.conf
#
# In your server block, add:
#   include /etc/nginx/snippets/block-bots.conf;
#
# To activate, uncomment the `if ($bad_bot)` line at the bottom.
# Test with: nginx -t && systemctl reload nginx
# Verify:    curl -i -A "python-requests/2.32.5" https://your-domain/

map $http_user_agent $bad_bot {
    default          0;
    ~*python         1;
    ~*aiohttp        1;
    ~*requests       1;
    ~*curl           1;
    ~*wget           1;
    ~*scrapy         1;
    ~*go-http-client 1;
    ~*httpx          1;
    ~*okhttp         1;
    ~*libwww-perl    1;
    ~*node-fetch     1;
    ~*axios          1;
    ~*headless       1;
    ~*phantomjs      1;
    ~*selenium       1;
    ~*puppeteer      1;
    ~*playwright     1;
    ~*nikto          1;
    ~*sqlmap         1;
    ~*masscan        1;
    ~*nmap           1;
    ~*acunetix       1;
    ~*nessus         1;
    ~*zgrab          1;
    ""               1;  # Empty User-Agent
}

# Static IP blocklist (mirror of config/security.php blocked_ips)
geo $blocked_ip {
    default          0;
    66.206.12.210    1;
    5.255.111.197    1;
    185.220.100.240  1;
    192.36.109.108   1;
    192.36.109.125   1;
    104.248.157.201  1;
    80.94.95.202     1;
    146.70.194.230   1;
    35.173.48.119    1;
    173.249.63.49    1;
    176.65.139.229   1;
}

# --- In your server { } block: ---
#
# Drop connection with no response (cheaper than 403 for bots).
# if ($bad_bot)    { return 444; }
# if ($blocked_ip) { return 444; }
#
# Global rate limit zone (define in http { } block, not server { }):
# limit_req_zone $binary_remote_addr zone=global:10m rate=60r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/m;
#
# Apply in location / { }:
# limit_req zone=global burst=20 nodelay;
#
