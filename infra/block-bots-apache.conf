# Apache bot-blocking snippet (mod_rewrite + mod_authz_host)
# Requires Apache 2.4+, mod_rewrite, mod_authz_core enabled.
#
# Option A — VirtualHost config (preferred):
#   Include /path/to/project/infra/block-bots-apache.conf
#   Then: apachectl configtest && systemctl reload apache2
#
# Option B — .htaccess in public/ (requires AllowOverride All):
#   Copy the blocks below into public/.htaccess after the existing rewrite rules.
#
# Verify: curl -i -A "python-requests/2.32.5" https://your-domain/

<IfModule mod_rewrite.c>
    RewriteEngine On

    # --- Bad User-Agent blocking ---
    # Returns 403. Each RewriteCond is OR'd; the final one blocks empty UA.
    RewriteCond %{HTTP_USER_AGENT} (python-requests|aiohttp|python\/|curl\/|wget\/|scrapy) [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} (go-http-client|httpx|okhttp|java\/|libwww-perl|node-fetch) [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} (axios\/|headless|phantomjs|selenium|puppeteer|playwright) [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} (masscan|nikto|nmap|sqlmap|acunetix|nessus|zgrab) [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} ^$
    RewriteRule .* - [F,L]

    # --- Static IP blocklist ---
    # Mirror of config/security.php blocked_ips. Add/remove IPs as needed.
    RewriteCond %{REMOTE_ADDR} ^66\.206\.12\.210$  [OR]
    RewriteCond %{REMOTE_ADDR} ^5\.255\.111\.197$  [OR]
    RewriteCond %{REMOTE_ADDR} ^185\.220\.100\.240$ [OR]
    RewriteCond %{REMOTE_ADDR} ^192\.36\.109\.108$ [OR]
    RewriteCond %{REMOTE_ADDR} ^192\.36\.109\.125$ [OR]
    RewriteCond %{REMOTE_ADDR} ^104\.248\.157\.201$ [OR]
    RewriteCond %{REMOTE_ADDR} ^80\.94\.95\.202$   [OR]
    RewriteCond %{REMOTE_ADDR} ^146\.70\.194\.230$ [OR]
    RewriteCond %{REMOTE_ADDR} ^35\.173\.48\.119$  [OR]
    RewriteCond %{REMOTE_ADDR} ^173\.249\.63\.49$  [OR]
    RewriteCond %{REMOTE_ADDR} ^176\.65\.139\.229$
    RewriteRule .* - [F,L]
</IfModule>

# --- Rate limiting ---
# Apache's mod_ratelimit is per-connection, not per-IP. For IP-based rate limiting
# at the web-server layer, use fail2ban watching your access log, or move to nginx.
# The application-layer throttle:global (60/min) middleware handles this in Laravel.

# Commands to deploy and verify:
#   apachectl configtest
#   systemctl reload apache2
#   curl -i -A "python-requests/2.32.5" https://your-domain/   # expect: 403
#   curl -i -A "Mozilla/5.0 Chrome/120"  https://your-domain/  # expect: 2xx/3xx
